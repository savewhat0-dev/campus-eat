services:
  - type: web
    name: campus-eats-bmu
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/campus.sqlite
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RETAILER_ACCOUNTS
        sync: false
    disk:
      name: campus-orders
      mountPath: /var/data
      sizeGB: 1
